# Once a day: Apple's sales reports (downloads, purchases, money earned) into
# the owner's private stats (.github/apple/sales.mjs, supabase/apple_sales.sql).
# Prints no numbers: this repository's logs are public.
name: Apple stats

on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to fetch (up to 365)
        required: false
        default: '10'

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same cleanup as testflight.yml: rebuild a clean PEM from the secret.
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ.get('ASC_KEY_P8', '')
          body = re.sub(r'(BEGIN|END)\s*PRIVATE\s*KEY', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          if len(base64.b64decode(body)) < 100:
              sys.exit('ASC_KEY_P8 does not look like a complete .p8 key.')
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          with open(sys.argv[1], 'w') as f:
              f.write(pem)
          PY

      - name: Fetch and save
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
          APPLE_STATS_TOKEN: ${{ secrets.APPLE_STATS_TOKEN }}
          DAYS: ${{ inputs.days || '3' }}
        run: node .github/apple/sales.mjs

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

# Makes PitchPop Family's in-app purchases in App Store Connect (see
# .github/appstore/products.mjs). Run it by hand from the Actions tab; safe
# to run again. Uses the same App Store Connect API key secrets as
# testflight.yml.
name: App Store products

on:
  workflow_dispatch:

jobs:
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same cleanup as testflight.yml: rebuild a clean PEM from the secret.
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 - "$RUNNER_TEMP/keys/AuthKey.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ.get('ASC_KEY_P8', '')
          body = re.sub(r'(BEGIN|END)\s*PRIVATE\s*KEY', '', raw)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          if len(base64.b64decode(body)) < 100:
              sys.exit('ASC_KEY_P8 does not look like a complete .p8 key.')
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          with open(sys.argv[1], 'w') as f:
              f.write(pem)
          PY

      - name: Make the products
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        # The output also goes in a notice, readable from the check run.
        run: |
          set -o pipefail
          node .github/appstore/products.mjs 2>&1 | tee "$RUNNER_TEMP/out.txt" || status=$?
          echo "::notice title=Result::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$RUNNER_TEMP/out.txt" | tail -c 3500)"
          exit ${status:-0}

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

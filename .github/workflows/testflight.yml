# Builds the PitchPop iPhone app on a GitHub Mac and uploads it to
# TestFlight, so a new build doesn't need Xcode on a local Mac.
#
# Runs on every push to main that changes the app, or by hand from the
# Actions tab (Run workflow). Signing is automatic: Xcode uses the App
# Store Connect API key in the repo secrets to fetch the certificate and
# profile it needs.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  Issuer ID shown above the keys list
#   ASC_KEY_P8     Contents of the AuthKey_<id>.p8 file (Admin access)
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/testflight.yml'

# One upload at a time; a newer push waits rather than racing it.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TEAM_ID: 6W8Q724D5F
  # TestFlight needs each upload's build number to be higher than the
  # last. Builds up to 5 were uploaded by hand from Xcode.
  BUILD_NUMBER_OFFSET: 5

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ~63MB speech voice is downloaded once and reused.
      - uses: actions/cache@v4
        with:
          path: .ios-assets-cache
          key: ios-assets-${{ hashFiles('scripts/copy-ios-assets.mjs') }}

      - run: npm ci

      - name: Build the web app and copy it into the iOS project
        run: npm run build:ios

      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
